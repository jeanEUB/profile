<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#070C0E">
<script>try{var t=localStorage.getItem("term-theme");if(t&&/^[a-z-]+$/.test(t))document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Jean Austin Rodriguez – Senior IT Officer & Data Protection Officer, Bahrain</title>
<meta name="description" content="Jean Austin Rodriguez is a technology leader with 20+ years of experience, currently Senior IT Officer and Data Protection Officer at Euro University of Bahrain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#070C0E; --term:#0D1518; --bar:#142024; --ink:#D5E4DF; --muted:#8AA09B; --line:#22343A;
  --accent:#70D2C1; --prompt:#9BE28A; --warn:#E8C06A; --err:#F08A7B; --soft:#16292B;
  --shadow:0 24px 70px rgba(0,0,0,.55);
  --window-shadow-color:0,0,0;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
/* Themes: the default above is "midnight". Add a block here and a row in THEMES (script) to add another. */
:root[data-theme="nord"]{--bg:#242933;--term:#2E3440;--bar:#3B4252;--ink:#D8DEE9;--muted:#A3ADC2;--line:#4C566A;--accent:#88C0D0;--prompt:#A3BE8C;--warn:#EBCB8B;--err:#E08A93;--soft:#3B4252}
:root[data-theme="gruvbox"]{--bg:#1D2021;--term:#282828;--bar:#32302F;--ink:#EBDBB2;--muted:#A89984;--line:#504945;--accent:#83A598;--prompt:#B8BB26;--warn:#FABD2F;--err:#FB4934;--soft:#3C3836}
:root[data-theme="monokai"]{--bg:#1B1C18;--term:#272822;--bar:#1E1F1C;--ink:#F8F8F2;--muted:#A59F85;--line:#49483E;--accent:#66D9EF;--prompt:#A6E22E;--warn:#E6DB74;--err:#FF4F8B;--soft:#3E3D32}
:root[data-theme="catppuccin-mocha"]{--bg:#11111B;--term:#1E1E2E;--bar:#181825;--ink:#CDD6F4;--muted:#A6ADC8;--line:#45475A;--accent:#CBA6F7;--prompt:#A6E3A1;--warn:#F9E2AF;--err:#F38BA8;--soft:#313244}
:root[data-theme="tokyo-night"]{--bg:#101014;--term:#1A1B26;--bar:#16161E;--ink:#C0CAF5;--muted:#9AA5CE;--line:#3B4261;--accent:#7AA2F7;--prompt:#9ECE6A;--warn:#E0AF68;--err:#F7768E;--soft:#292E42}
:root[data-theme="vscode"]{--bg:#121212;--term:#1E1E1E;--bar:#252526;--ink:#D4D4D4;--muted:#9D9D9D;--line:#3C3C3C;--accent:#569CD6;--prompt:#4EC9B0;--warn:#DCDCAA;--err:#F48771;--soft:#2A2D2E}
:root[data-theme="matrix"]{--bg:#030803;--term:#000000;--bar:#0A140A;--ink:#28FE14;--muted:#1FB312;--line:#145A0E;--accent:#B6FFAE;--prompt:#28FE14;--warn:#E5E500;--err:#FF5F56;--soft:#0B1F0A}
:root[data-theme="solarized-light"]{color-scheme:light;--bg:#E4DDC8;--term:#FDF6E3;--bar:#EEE8D5;--ink:#405B63;--muted:#5F757D;--line:#D3CBB7;--accent:#1A6FB0;--prompt:#5F7000;--warn:#8A6800;--err:#C9302C;--soft:#EEE8D5;--window-shadow-color:70,60,30;--shadow:0 24px 70px rgba(70,60,30,.22)}
:root[data-theme="github-light"]{color-scheme:light;--bg:#EAEEF2;--term:#FFFFFF;--bar:#F6F8FA;--ink:#1F2328;--muted:#59636E;--line:#D1D9E0;--accent:#0969DA;--prompt:#1A7F37;--warn:#9A6700;--err:#CF222E;--soft:#DDF4FF;--window-shadow-color:31,35,40;--shadow:0 24px 70px rgba(31,35,40,.18)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;height:100vh;height:100dvh;padding:clamp(1rem,7vh,4.5rem) clamp(1rem,6vw,5rem);background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:.95rem;line-height:1.6}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.term{display:flex;flex-direction:column;width:100%;max-width:60rem;height:100%;max-height:46rem;overflow:hidden;background:var(--term);border:1px solid var(--line);border-radius:10px;box-shadow:4px 4px 6px rgba(var(--window-shadow-color),.28),12px 16px 24px -6px rgba(var(--window-shadow-color),.3),24px 32px 60px -12px rgba(var(--window-shadow-color),.25),inset 0 1px 0 rgba(255,255,255,.06)}
.bar{flex:none;display:flex;align-items:center;gap:.75rem;padding:.6rem .9rem;background:var(--bar);border-bottom:1px solid var(--line);color:var(--muted);font-size:.8rem}
[hidden]{display:none!important}
.term.is-maximized{position:fixed;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);max-width:none;max-height:none}
.dots{display:flex;flex:none;gap:.15rem}
.window-control{display:grid;place-items:center;width:1.5rem;height:1.5rem;padding:0;border:0;background:transparent;cursor:pointer}
.window-control span{display:grid;place-items:center;width:.85rem;height:.85rem;border-radius:50%;background:#F08A7B;color:#182020;font:bold .7rem/1 var(--mono)}
.window-control:nth-child(2) span{background:#E8C06A}
.window-control:nth-child(3) span{background:#9BE28A}
.window-control:hover span{filter:brightness(1.2)}
.minimized-bar{position:fixed;bottom:5%;left:10%;width:80%;max-width:24rem;display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--bar);color:var(--ink);box-shadow:var(--shadow);font:inherit;cursor:pointer}
.minimized-bar .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.minimized-bar .restore-label{margin-left:auto;color:var(--accent);font-size:.8rem}
.minimized-bar:hover{border-color:var(--accent)}
.window-message{max-width:32rem;text-align:center;color:var(--muted)}
.window-message p{margin:0 0 1rem}
.window-message button{padding:.5rem 1rem;border:1px solid var(--accent);border-radius:4px;background:var(--bar);color:var(--accent);font:inherit;cursor:pointer}
.bar .title{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar select{flex:none;max-width:9.5rem;font:inherit;font-size:.75rem;color:var(--muted);background:var(--term);border:1px solid var(--line);border-radius:4px;padding:.15rem .3rem;cursor:pointer}
.bar select:hover{color:var(--accent);border-color:var(--accent)}

.screen{flex:1;min-height:0;overflow-y:auto;padding:1rem 1rem 1.5rem;cursor:text;scrollbar-color:var(--line) transparent}
.entry{margin:0 0 1rem}
.line{display:flex;gap:.6ch;align-items:baseline;flex-wrap:nowrap}
.ps1{flex:none;white-space:nowrap;color:var(--prompt)}
.ps1 .path{color:var(--accent)}
.ps1 .sym{color:var(--ink)}
.typed{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.out{margin:.35rem 0 0;overflow-wrap:anywhere}
.out p{margin:0 0 .7rem;max-width:72ch}
.out p:last-child{margin-bottom:0}
.out h1{font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.15;margin:0 0 .4rem;color:var(--accent);font-weight:700;letter-spacing:-.02em}
.out h2{font-size:1rem;margin:0 0 .5rem;color:var(--accent);font-weight:700}
.out h2::before{content:"## ";color:var(--muted)}
.out h3{font-size:.95rem;margin:0;color:var(--ink);font-weight:700}
.out ul{margin:.4rem 0 .8rem;padding:0;list-style:none;max-width:76ch}
.out ul li{padding-left:2ch;text-indent:-2ch;margin-bottom:.3rem}
.out ul li::before{content:"- ";color:var(--accent)}
.out mark{background:var(--accent);color:var(--term);font-weight:700;padding:.05rem .5ch;border-radius:3px}
.out pre.grep{margin:0 0 .7rem;padding:.6rem 1.5ch;font:inherit;white-space:pre-wrap;background:var(--soft);border-left:2px solid var(--accent);border-radius:0 4px 4px 0;max-width:72ch}
.muted{color:var(--muted)}
.warn{color:var(--warn)}
.err{color:var(--err)}
.job{margin:0 0 .9rem;padding-left:1.5ch;border-left:2px solid var(--line)}
.job.now{border-left-color:var(--accent)}
.job p{margin:0}
.grid{display:grid;grid-template-columns:max-content 1fr;gap:.15rem 2ch;margin:0 0 .7rem}
.grid dt{color:var(--accent)}
.grid dd{margin:0;color:var(--ink)}
.cols{display:flex;flex-wrap:wrap;gap:.3rem 3ch}

button.cmd{font:inherit;color:var(--accent);background:none;border:0;border-bottom:1px dashed var(--accent);padding:0;cursor:pointer;text-indent:0}
button.cmd:hover{color:var(--prompt);border-bottom-color:var(--prompt)}

.input-line{position:relative}
#cmd{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:none;border:0;outline:0;padding:0;caret-color:var(--prompt)}
@media (min-width:40rem){#cmd{font-size:inherit}}

.chips{flex:none;display:flex;gap:.4rem;padding:.55rem .9rem;background:var(--bar);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font:inherit;font-size:.8rem;color:var(--muted);background:var(--term);border:1px solid var(--line);border-radius:4px;padding:.3rem .6rem;cursor:pointer}
.chips button:hover{color:var(--accent);border-color:var(--accent);background:var(--soft)}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
noscript .out{padding:1rem}
@media (max-width:34rem){
  body{font-size:.875rem}
  .ps1 .host{display:none}
}
</style>
</head>
<body>
<div class="term" id="terminal">
  <div class="bar">
    <div class="dots" role="group" aria-label="Window controls">
      <button class="window-control" id="close-window" type="button" aria-label="Close window" title="Close window" aria-controls="terminal"><span aria-hidden="true"></span></button>
      <button class="window-control" id="minimize-window" type="button" aria-label="Minimize window" title="Minimize window" aria-controls="terminal"><span aria-hidden="true"></span></button>
      <button class="window-control" id="maximize-window" type="button" aria-label="Maximize window" title="Maximize window" aria-controls="terminal" aria-pressed="false"><span aria-hidden="true"></span></button>
    </div>
    <span class="title" aria-hidden="true">visitor@jean-rodriguez: ~</span>
    <label class="sr-only" for="theme">Theme</label>
    <select id="theme"></select>
  </div>

  <main class="screen" id="screen">
    <div id="out" role="log" aria-live="polite" aria-label="Terminal output"></div>

    <noscript>
      <div class="out">
        <h1>Jean Austin Rodriguez</h1>
        <p>Senior IT Officer and Data Protection Officer · Manama, Bahrain</p>
        <p>I lead innovation and the responsible use of data and technology at Euro University of Bahrain, with 20+ years of experience in infrastructure, security and teams that deliver.</p>
        <p>Open-source advocate and credited Mozilla Firefox contributor: <a href="https://www.mozilla.org/credits/#:~:text=Jean%20Austin%20Rodriguez" rel="noopener">see my name on Mozilla's Our Contributors page</a>.</p>
        <p class="muted">This page is an interactive terminal and needs JavaScript. You can still reach me here:</p>
        <p><a href="https://www.linkedin.com/in/jadrodriguez" rel="noopener">LinkedIn</a></p>
      </div>
    </noscript>

    <form class="line input-line" id="form" autocomplete="off">
      <label class="ps1" for="cmd"><span class="host">visitor@jean-rodriguez:</span><span class="path">~</span><span class="sym">$</span><span class="sr-only"> Type a command</span></label>
      <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="hint">
      <span id="hint" class="sr-only">Type help and press Enter to list commands. Tab completes, up and down arrows browse history.</span>
    </form>
  </main>

  <nav class="chips" aria-label="Quick commands">
    <button type="button" data-cmd="help">help</button>
    <button type="button" data-cmd="about">about</button>
    <button type="button" data-cmd="focus">focus</button>
    <button type="button" data-cmd="opensource">opensource</button>
    <button type="button" data-cmd="experience">experience</button>
    <button type="button" data-cmd="education">education</button>
    <button type="button" data-cmd="contact">contact</button>
    <button type="button" data-cmd="clear">clear</button>
  </nav>
</div>

<button class="minimized-bar" id="minimized-window" type="button" aria-label="Restore terminal window" aria-controls="terminal" hidden>
  <span aria-hidden="true">▣</span><span class="title">visitor@jean-rodriguez: ~</span><span class="restore-label">Restore</span>
</button>
<div class="window-message" id="closed-window" hidden>
  <p id="window-status" role="status" aria-live="polite"></p>
  <button id="reopen-window" type="button" aria-controls="terminal">Reopen now</button>
</div>

<script>
(() => {
"use strict";

/* ---------- content ---------- */
const LINKS = {
  linkedin: "https://www.linkedin.com/in/jadrodriguez",
  // The text fragment makes the browser scroll to and highlight the name on Mozilla's page.
  mozilla: "https://www.mozilla.org/credits/#:~:text=Jean%20Austin%20Rodriguez"
};

const JOBS = [
  { when: "September 2022 – Present", title: "Senior IT Officer", org: "Euro University of Bahrain", place: "Manama, Bahrain", items: [
    "Own end-to-end IT service delivery, driving toward 99.9% uptime for mission-critical academic platforms.",
    "Advise executive leadership on IT investment roadmaps for scalability and long-term sustainability.",
    "Build IT governance frameworks, compliance policies and procedures for campus infrastructure.",
    "Serve as Data Protection Officer: modernize network and cybersecurity protocols, develop data governance frameworks, and roll out privacy safeguards across SharePoint, OneDrive and cloud environments.",
    "Built a custom RAG-based AI agent (Insight Engine) that connects LLMs to SharePoint for executive decision-making.",
    "Develop an AI-powered student recruitment chatbot and BI dashboards for senior stakeholders.",
    "Mentor student interns on security hardening, lab readiness and the student digital experience."
  ]},
  { when: "2021 – 2022", title: "IT Consultant", org: "Kalaam Telecom Group", place: "Seef, Bahrain", items: [
    "Led network security and hybrid infrastructure upgrades that enabled a successful ISO 27001 re-certification.",
    "Migrated the company to Azure Active Directory and Microsoft 365.",
    "Deployed Microsoft EMS and mandatory MFA across the enterprise.",
    "Upgraded Veeam servers and configured Voice VLANs, reducing downtime; kept core services at 99.9% uptime."
  ]},
  { when: "2018 – 2019", title: "System Administrator", org: "Gulf University", place: "Bahrain", items: [
    "Drove the university's digital transformation, including the move to Microsoft 365 and Azure.",
    "Modernized classrooms, student information systems and library management platforms.",
    "Enforced IT security policies and backup protocols for critical student and staff databases.",
    "Led a technical team and standardized support workflows and documentation.",
    "Delivered HR biometrics, international journal website upgrades and automated exam scheduling."
  ]}
];

const EARLIER = [
  ["2021", "IT Consultant, Majid Al Futtaim", "Technical advisory for enterprise clients, data center and network performance."],
  ["2019 – 2021", "IT Consultant, AVASO Technology Solutions", "Turned infrastructure requirements into project roadmaps and data-driven recommendations for enterprise clients."],
  ["2014 – 2017", "IT Consultant, New York Life Insurance Company (Philippines)", "Data center virtualization, database upgrades and disaster recovery; led migrations and mentored engineering and help-desk teams."],
  ["2010 – 2014", "System Administrator, Toyota Motor Philippines Corporation", "Santa Rosa City, Philippines."],
  ["2007 – 2010", "System Administrator, International Rice Research Institute", "Ran core infrastructure, backups and the help desk; led deployment of 2,000+ computers."],
  ["2005 – 2007", "Production Planner, Fujitsu Ten Corporation of the Philippines", "Maintained bills of materials and served as an Internal Quality Auditor."],
  ["2004", "Technical Support Representative, TeleTech", "First-level support for US telecommunications clients."]
];

const THEMES = [
  ["midnight", "Midnight", "dark"],
  ["nord", "Nord", "dark"],
  ["gruvbox", "Gruvbox Dark", "dark"],
  ["monokai", "Monokai", "dark"],
  ["catppuccin-mocha", "Catppuccin Mocha", "dark"],
  ["tokyo-night", "Tokyo Night", "dark"],
  ["vscode", "VS Code Dark+", "dark"],
  ["matrix", "Matrix (Homebrew)", "dark"],
  ["solarized-light", "Solarized Light", "light"],
  ["github-light", "GitHub Light", "light"]
];
const themeSelect = document.getElementById("theme");
themeSelect.innerHTML = THEMES.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");
const currentTheme = () => document.documentElement.dataset.theme || "midnight";

function setTheme(id, save = true) {
  if (!THEMES.some(t => t[0] === id)) id = "midnight";
  if (id === "midnight") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = id;
  themeSelect.value = id;
  document.querySelector('meta[name="theme-color"]').content =
    getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  if (save) { try { localStorage.setItem("term-theme", id); } catch (e) { /* private mode */ } }
}
setTheme(currentTheme(), false);
themeSelect.addEventListener("change", () => setTheme(themeSelect.value));

/* ---------- helpers ---------- */
const run = c => `<button type="button" class="cmd" data-cmd="${c}">${c}</button>`;
const ext = (href, text) => `<a href="${href}" rel="noopener"${href.startsWith("http") ? ' target="_blank"' : ""}>${text}</a>`;
const list = items => `<ul>${items.map(i => `<li>${i}</li>`).join("")}</ul>`;

const jobHtml = (j, i, open) => `
  <div class="job${i === 0 ? " now" : ""}">
    <p class="muted">[${i + 1}] ${j.when}</p>
    <h3>${j.title}, ${j.org}</h3>
    <p class="muted">${j.place}</p>
    ${open ? list(j.items) : `<p>${run("experience " + (i + 1))} <span class="muted">→ ${j.items.length} highlights</span></p>`}
  </div>`;

/* ---------- commands ---------- */
const HELP = [
  ["whoami", "Who this is, in one line"],
  ["about", "Short bio"],
  ["focus", "What I focus on"],
  ["opensource", "Open-source advocacy and Mozilla Firefox contribution"],
  ["experience", "Recent roles (add a number or --all for highlights)"],
  ["earlier", "Earlier roles, 2004 – 2021"],
  ["education", "Education, certifications, languages"],
  ["contact", "How to reach me"],
  ["open &lt;name&gt;", "Open linkedin or mozilla"],
  ["theme", "List colour themes, or switch with theme &lt;name&gt;"],
  ["ls / cat", "Browse the same content as files"],
  ["history", "Commands you have run"],
  ["clear", "Clear the screen (Ctrl+L)"]
];

const FILES = {
  "about.txt": "about", "focus.txt": "focus", "opensource.txt": "opensource", "experience.log": "experience --all",
  "earlier-roles.log": "earlier", "education.txt": "education", "contact.txt": "contact"
};

const commands = {
  help: () => `
    <h2>Available commands</h2>
    <dl class="grid">${HELP.map(([c, d]) => `<dt>${c.includes("&") || c.includes("/") ? c : run(c)}</dt><dd>${d}</dd>`).join("")}</dl>
    <p class="muted">Tab completes · ↑/↓ recall history · click or tap any underlined command to run it.</p>`,

  whoami: () => `
    <h1>Jean Austin Rodriguez</h1>
    <p>Senior IT Officer and Data Protection Officer · Manama, Bahrain</p>
    <p class="muted">I lead innovation and the responsible use of data and technology at Euro University of Bahrain, with 20+ years of experience in infrastructure, security and teams that deliver.</p>`,

  opensource: () => `
    <h2>Open source</h2>
    <p>I'm an open-source advocate. I believe software that anyone can inspect, improve and share makes technology more trustworthy and more accessible, and I bring that thinking to the systems and teams I work with.</p>
    <h3>Mozilla Firefox contributor</h3>
    <p class="muted">I contributed to Mozilla Firefox, and Mozilla credits me by name on its Our Contributors page, which thanks the people "whose efforts over many years have made this software what it is."</p>
    <pre class="grep"><span class="muted">$ curl -s mozilla.org/credits | grep -i rodriguez</span>
<mark>Jean Austin Rodriguez</mark></pre>
    <p>${ext(LINKS.mozilla, "See my name on Mozilla's Our Contributors page ↗")} <span class="muted">or run</span> ${run("open mozilla")}</p>
    <p class="muted">The link jumps to my name and highlights it. If your browser doesn't, search the page for "Jean Austin Rodriguez".</p>`,

  about: () => `
    <h2>About</h2>
    <p>I'm a technology leader focused on digital transformation and high-impact infrastructure, with a track record of building high-performing teams in higher education. I started in technical support in 2004 and have since worked across universities, telecoms, consulting, manufacturing and research.</p>
    <p>Today I own IT service delivery at Euro University of Bahrain, advise executive leadership on IT investment, and act as the university's Data Protection Officer. I also build AI tools that help leaders make decisions and help the admissions team reach students.</p>
    <p>I'm also an open-source advocate and a credited contributor to Mozilla Firefox.</p>
    <p class="muted">Next: ${run("focus")}, ${run("opensource")} or ${run("experience")}</p>`,

  focus: () => `
    <h2>What I focus on</h2>
    <h3>IT governance and service delivery</h3>
    <p class="muted">Campus-wide platforms (LMS, E-Library, information systems), policies, and uptime that faculty and students can rely on.</p>
    <h3>Data protection</h3>
    <p class="muted">Governance aligned with international standards and Bahrain PDPL, with privacy safeguards across SharePoint, OneDrive and the cloud.</p>
    <h3>Applied AI</h3>
    <p class="muted">RAG-based agents, chatbots and BI dashboards built on real institutional data. Interests include fine tuning and Model Context Protocol (MCP).</p>`,

  experience: args => {
    const a = args[0];
    if (a === undefined) {
      return `<h2>Experience</h2>${JOBS.map((j, i) => jobHtml(j, i, false)).join("")}
        <p class="muted">Show everything: ${run("experience --all")} · Before 2021: ${run("earlier")}</p>`;
    }
    if (a === "--all" || a === "-a") {
      return `<h2>Experience</h2>${JOBS.map((j, i) => jobHtml(j, i, true)).join("")}
        <p class="muted">Before 2021: ${run("earlier")}</p>`;
    }
    const n = Number(a);
    if (Number.isInteger(n) && n >= 1 && n <= JOBS.length) return jobHtml(JOBS[n - 1], n - 1, true);
    return `<p class="err">experience: expected a number from 1 to ${JOBS.length}, or --all</p>`;
  },

  earlier: () => `
    <h2>Earlier roles (2004 – 2021)</h2>
    ${EARLIER.map(([when, title, note]) => `<div class="job"><p class="muted">${when}</p><h3>${title}</h3><p class="muted">${note}</p></div>`).join("")}`,

  education: () => `
    <h2>Education &amp; credentials</h2>
    <h3>Education</h3>
    <p class="muted">B.S. in Information Technology, Computer Science<br>Colegio de San Juan de Letran Calamba, 2000 – 2004</p>
    <h3>Certifications</h3>
    ${list(["Personal Data Protection Guardian license", "Cloud Computing Law: Data Protection and Cybersecurity certificate", "AI Fluency &amp; Framework"])}
    <h3>Languages</h3>
    <p class="muted">Filipino (native or bilingual)<br>English (full professional)</p>
    <h3>Honors</h3>
    <p class="muted">Eagle Scout</p>`,

  contact: () => `
    <h2>Contact</h2>
    <p>The quickest way to reach me is LinkedIn.</p>
    <dl class="grid">
      <dt>linkedin</dt><dd>${ext(LINKS.linkedin, "linkedin.com/in/jadrodriguez")}</dd>
    </dl>`,

  open: args => {
    const key = (args[0] || "").toLowerCase().replace(/[^a-z]/g, "");
    const href = Object.hasOwn(LINKS, key) ? LINKS[key] : undefined;
    if (!href) return `<p class="err">open: choose one of linkedin, mozilla</p>`;
    window.open(href, "_blank", "noopener");
    return `<p>Opening ${key}… <span class="muted">If nothing happened:</span> ${ext(href, href.replace(/^https:\/\/|#.*$/g, ""))}</p>`;
  },

  theme: args => {
    const want = (args[0] || "").toLowerCase();
    if (!want) {
      return `<h2>Themes</h2>
        <dl class="grid">${THEMES.map(([id, label, kind]) =>
          `<dt>${run("theme " + id)}</dt><dd>${label} <span class="muted">· ${kind}${id === currentTheme() ? " · current" : ""}</span></dd>`).join("")}</dl>
        <p class="muted">Your choice is remembered on this device.</p>`;
    }
    const hit = THEMES.find(t => t[0] === want);
    if (!hit) return `<p class="err">theme: ${escapeHtml(args[0])}: no such theme. Try ${run("theme")}</p>`;
    setTheme(hit[0]);
    return `<p>Theme set to ${hit[1]}.</p>`;
  },

  ls: () => `<div class="cols">${Object.keys(FILES).map(f => run("cat " + f)).join("")}</div>`,

  cat: args => {
    if (!args[0]) return `<p class="err">cat: missing file name. Try ${run("ls")}</p>`;
    const target = FILES[args[0].toLowerCase().replace(/^\.\//, "")];
    if (!target) return `<p class="err">cat: ${escapeHtml(args[0])}: No such file. Try ${run("ls")}</p>`;
    const [name, ...rest] = target.split(" ");
    return commands[name](rest);
  },

  history: () => history.length
    ? `<dl class="grid">${history.map((h, i) => `<dt class="muted">${i + 1}</dt><dd>${escapeHtml(h)}</dd>`).join("")}</dl>`
    : `<p class="muted">No commands yet.</p>`,

  date: () => `<p>${new Date().toString()}</p>`,
  pwd: () => `<p>/home/visitor</p>`,
  echo: args => `<p>${escapeHtml(args.join(" "))}</p>`,
  sudo: () => `<p class="warn">visitor is not in the sudoers file. This incident will be reported to the Data Protection Officer.</p>`,
  exit: () => `<p class="muted">There is no escape, but thanks for visiting. Try ${run("contact")} before you go.</p>`,
  clear: () => { out.replaceChildren(); return null; }
};
const ALIASES = { "?": "help", man: "help", bio: "about", oss: "opensource", "open-source": "opensource", mozilla: "opensource", firefox: "opensource", work: "experience", exp: "experience", jobs: "experience",
  edu: "education", certs: "education", linkedin: "contact", cls: "clear", dir: "ls", ll: "ls" };
const VISIBLE = ["help", "whoami", "about", "focus", "opensource", "experience", "earlier", "education", "contact", "open", "theme", "ls", "cat", "history", "clear"];

/* ---------- terminal ---------- */
const out = document.getElementById("out");
const screen = document.getElementById("screen");
const form = document.getElementById("form");
const input = document.getElementById("cmd");
const ps1 = form.querySelector(".ps1");
const history = [];
let hIndex = 0, draft = "";

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function exec(raw, { record = true } = {}) {
  const text = raw.trim();
  const entry = document.createElement("div");
  entry.className = "entry";

  const line = document.createElement("div");
  line.className = "line";
  const p = document.createElement("span");
  p.className = "ps1";
  p.innerHTML = ps1.innerHTML.replace(/<span class="sr-only">.*?<\/span>/, "");
  const typed = document.createElement("span");
  typed.className = "typed";
  typed.textContent = text;
  line.append(p, typed);
  entry.append(line);

  let html = "";
  if (text) {
    if (record && history[history.length - 1] !== text) history.push(text);
    hIndex = history.length;
    const [first, ...args] = text.split(/\s+/);
    const lower = first.toLowerCase();
    const name = Object.hasOwn(ALIASES, lower) ? ALIASES[lower] : lower;
    if (Object.hasOwn(commands, name)) {
      html = commands[name](args);
      if (html === null) return;            // clear
    } else {
      const guess = VISIBLE.find(c => c.startsWith(name.slice(0, 2)));
      html = `<p class="err">${escapeHtml(first)}: command not found</p>
        <p class="muted">${guess ? `Did you mean ${run(guess)}? ` : ""}Type ${run("help")} to list commands.</p>`;
    }
  }
  if (html) {
    const body = document.createElement("div");
    body.className = "out";
    body.innerHTML = html;
    entry.append(body);
  }
  out.append(entry);
  entry.scrollIntoView({ block: "start" });
}

function complete() {
  const value = input.value;
  const parts = value.split(/\s+/);
  let pool, stem, prefix;
  if (parts.length <= 1) { pool = VISIBLE; stem = parts[0] || ""; prefix = ""; }
  else {
    const head = parts[0].toLowerCase();
    pool = head === "cat" ? Object.keys(FILES)
         : head === "open" ? Object.keys(LINKS)
         : head === "theme" ? THEMES.map(t => t[0])
         : ["experience", "exp", "work", "jobs"].includes(head) ? ["--all", ...JOBS.map((_, i) => String(i + 1))]
         : [];
    stem = parts[parts.length - 1];
    prefix = parts.slice(0, -1).join(" ") + " ";
  }
  const hits = pool.filter(c => c.startsWith(stem.toLowerCase()));
  if (hits.length === 1) input.value = prefix + hits[0] + (prefix ? "" : " ");
  else if (hits.length > 1) {
    let common = hits[0];
    for (const h of hits) while (!h.startsWith(common)) common = common.slice(0, -1);
    if (common.length > stem.length) input.value = prefix + common;
    else {
      const hint = document.createElement("div");
      hint.className = "entry muted";
      hint.textContent = hits.join("   ");
      out.append(hint);
      form.scrollIntoView({ block: "end" });
    }
  }
}

form.addEventListener("submit", e => {
  e.preventDefault();
  if (input.readOnly) return;
  const v = input.value;
  input.value = "";
  exec(v);
});

input.addEventListener("keydown", e => {
  if (e.key === "Tab" && input.value.trim()) { e.preventDefault(); complete(); }
  else if (e.key === "ArrowUp") {
    if (!history.length) return;
    e.preventDefault();
    if (hIndex === history.length) draft = input.value;
    hIndex = Math.max(0, hIndex - 1);
    input.value = history[hIndex];
  } else if (e.key === "ArrowDown") {
    if (hIndex >= history.length) return;
    e.preventDefault();
    hIndex += 1;
    input.value = hIndex === history.length ? draft : history[hIndex];
  } else if (e.key.toLowerCase() === "l" && e.ctrlKey) { e.preventDefault(); commands.clear(); }
  else if (e.key.toLowerCase() === "c" && e.ctrlKey && !String(getSelection())) {
    e.preventDefault();
    const v = input.value; input.value = "";
    exec(v + "^C", { record: false }); out.lastElementChild.querySelector(".out")?.remove();
  }
});

// Click or tap an underlined command, or a chip, to run it.
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-cmd]");
  if (btn) {
    if (input.readOnly) return;
    exec(btn.dataset.cmd);
    if (matchMedia("(hover:hover)").matches) input.focus({ preventScroll: true });
    return;
  }
  // Clicking empty terminal space focuses the prompt, without breaking text selection.
  if (e.target.closest(".screen") && !e.target.closest("a,button,input,select") && !String(getSelection())) {
    input.focus({ preventScroll: true });
  }
});

/* ---------- window controls ---------- */
const terminal = document.getElementById("terminal");
const closeButton = document.getElementById("close-window");
const minimizeButton = document.getElementById("minimize-window");
const maximizeButton = document.getElementById("maximize-window");
const minimizedBar = document.getElementById("minimized-window");
const closedMessage = document.getElementById("closed-window");
const windowStatus = document.getElementById("window-status");
const reopenButton = document.getElementById("reopen-window");
let reopenTimer;
let restoreFocus = closeButton;

function restoreWindow() {
  clearTimeout(reopenTimer);
  minimizedBar.hidden = true;
  closedMessage.hidden = true;
  windowStatus.textContent = "";
  terminal.hidden = false;
  restoreFocus.focus({ preventScroll: true });
}

closeButton.addEventListener("click", () => {
  restoreFocus = closeButton;
  terminal.hidden = true;
  closedMessage.hidden = false;
  windowStatus.textContent = "Window closed. Thanks for visiting! Reopening in 3 seconds…";
  reopenButton.focus({ preventScroll: true });
  clearTimeout(reopenTimer);
  reopenTimer = setTimeout(restoreWindow, 3000);
});

minimizeButton.addEventListener("click", () => {
  restoreFocus = minimizeButton;
  terminal.hidden = true;
  minimizedBar.hidden = false;
  minimizedBar.focus({ preventScroll: true });
});
minimizedBar.addEventListener("click", restoreWindow);
reopenButton.addEventListener("click", restoreWindow);

maximizeButton.addEventListener("click", () => {
  const maximized = terminal.classList.toggle("is-maximized");
  const label = maximized ? "Restore window size" : "Maximize window";
  maximizeButton.setAttribute("aria-pressed", String(maximized));
  maximizeButton.setAttribute("aria-label", label);
  maximizeButton.title = label;
});

/* ---------- boot ---------- */
const HASH = { themes: "theme", opensource: "opensource", about: "about", focus: "focus", experience: "experience", education: "education", contact: "contact" };

async function boot() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const greet = document.createElement("div");
  greet.className = "entry muted";
  greet.textContent = `Last login: ${new Date().toDateString()} · © ${new Date().getFullYear()} Jean Austin Rodriguez`;
  out.append(greet);

  if (!reduce) {
    input.readOnly = true;
    for (const ch of "whoami") {
      input.value += ch;
      await new Promise(r => setTimeout(r, 70));
    }
    await new Promise(r => setTimeout(r, 200));
    input.value = "";
    input.readOnly = false;
  }
  exec("whoami", { record: false });

  const tip = document.createElement("div");
  tip.className = "entry";
  tip.innerHTML = `<span class="muted">Type</span> ${run("help")} <span class="muted">to see what you can ask, or jump to</span> ${run("about")}, ${run("opensource")}, ${run("experience")}, ${run("contact")}.`;
  out.append(tip);

  const hashKey = location.hash.slice(1).toLowerCase();
  const deep = Object.hasOwn(HASH, hashKey) ? HASH[hashKey] : undefined;
  if (deep) exec(deep, { record: false });
  else screen.scrollTop = 0;

  if (!terminal.hidden && matchMedia("(hover:hover)").matches) input.focus({ preventScroll: true });
}
boot();
})();
</script>
